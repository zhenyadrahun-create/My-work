const DAY=864e5, KEY="sto-tracker-v1";
const DEF={price:"1500",me:"Orvik",portfolio:"https://orvikweb.netlify.app",base:"https://zhenyadrahun-create.github.io/sto-outreach",
t1:"Добрий день! Це {me}. Знайшов {name} на Google Maps: відгуки хороші, а сайту, який приводив би нових клієнтів, не побачив.\n\nЯ вже зробив для вас демо-версію сайту: {url}\nТам послуги, кнопка «Зателефонувати» і карта. Це макет, його можна змінити під вас.\n\nЯкщо сподобається, зроблю під ключ з вашими фото, цінами й контактами за {price} грн (одноразово, без абонплати). Приклади робіт: {portfolio}\n\nПокажу, як це буде виглядати саме у вас?",
t2:"Добрий день! Це {me}, нагадую про демо-сайт для {name}: {url}\n\nМожу швидко підлаштувати його під вас: фото, прайс, графік роботи. Вартість {price} грн, готовий за 1-2 дні.\n\nЯкщо зараз не актуально, просто напишіть, і я більше не турбуватиму."};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=Object.assign({cfg:{},leads:{}},S||{}); S.cfg=Object.assign({},DEF,S.cfg);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
let tab="new", limit=40;
const L=id=>S.leads[id]||(S.leads[id]={});
function demo(l){return S.cfg.base.replace(/\/$/,"")+"/sites/sto-"+l.id+"/"}
function fill(t,l){const c=S.cfg;return t.replace(/\{name\}/g,l.n).replace(/\{url\}/g,demo(l)).replace(/\{price\}/g,c.price).replace(/\{me\}/g,c.me).replace(/\{portfolio\}/g,c.portfolio)}
function stage(l){const s=L(l.id);if(s.r)return"done";if(!s.t1)return"new";if(s.t2)return"wait2";return Date.now()-s.t1>=2*DAY?"due":"wait"}
function msg(l){return fill(stage(l)==="new"?S.cfg.t1:S.cfg.t2,l)}
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Текст скопирован")}catch(e){toast("Не удалось скопировать, нажмите и удерживайте текст")}}
function igUrl(l){const h=(L(l.id).ig||"").trim().replace(/^@/,"").replace(/^https?:\/\/(www\.)?instagram\.com\//,"").replace(/[/?].*$/,"");
  return h?"https://www.instagram.com/"+h+"/":"https://www.google.com/search?q="+encodeURIComponent("instagram "+l.n+" "+l.c)}
function webUrl(l){return"https://www.google.com/search?q="+encodeURIComponent(l.n+" "+l.c+" сайт")}
function fmtPhone(p){return p.length===12?`+${p.slice(0,3)} ${p.slice(3,5)} ${p.slice(5,8)} ${p.slice(8,10)} ${p.slice(10)}`:"+"+p}
function ago(t){const d=Math.floor((Date.now()-t)/DAY);return d<=0?"сегодня":d+" дн. назад"}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function card(l){
  const s=L(l.id),st=stage(l),el=document.createElement("div");el.className="card"+(st==="due"?" due":"");el.dataset.id=l.id;
  let badge='<span class="badge">новый</span>';
  if(st==="due")badge='<span class="badge due">пора повторить</span>';
  else if(st==="wait")badge=`<span class="badge">написал ${ago(s.t1)}</span>`;
  else if(st==="wait2")badge=`<span class="badge">повтор ${ago(s.t2)}</span>`;
  else if(st==="done")badge='<span class="badge ok">ответил</span>';
  const txt=msg(l),wa=l.m?`https://wa.me/${l.p}?text=${encodeURIComponent(txt)}`:"#",tg=l.m?`https://t.me/+${l.p}`:"#";
  const sendLabel=st==="new"?"Написал":(st==="due"||st==="wait")?"Повтор отправлен":"";
  el.innerHTML=`<div class="top"><div><div class="name">${esc(l.n)}</div><div class="meta">${esc(l.c)}${l.a?", "+esc(l.a):""}</div></div>${badge}</div>
  <div class="phone">${fmtPhone(l.p)}${l.m?"":" <span class='meta'>(городской, без мессенджеров)</span>"}</div>
  <div class="btns">
   <a class="b wa${l.m?"":" off"}" href="${wa}" target="_blank" rel="noopener" data-a="wa">WhatsApp</a>
   <a class="b pri${l.m?"":" off"}" href="${tg}" target="_blank" rel="noopener" data-a="tg">Telegram</a>
   <a class="b" href="${igUrl(l)}" target="_blank" rel="noopener" data-a="ig">Instagram</a>
   <button class="b" type="button" data-a="copy">Копировать текст</button>
  </div>
  <div class="mini">${sendLabel?`<button class="b" type="button" data-a="sent">${sendLabel}</button>`:""}
   ${st!=="new"&&st!=="done"?'<button class="b" type="button" data-a="reply">Ответил</button>':""}
   ${st!=="new"?'<button class="b" type="button" data-a="reset">Сбросить</button>':""}
   <a class="b" href="${webUrl(l)}" target="_blank" rel="noopener">Проверить сайт</a>
   <a class="b" href="${demo(l)}" target="_blank" rel="noopener">Демо</a></div>
  <details class="more"><summary>Сайт, Instagram, заметка</summary><div class="f">
   <label>Есть ли у них сайт</label>
   <select data-f="site"><option value="">не проверял</option><option value="none">нет сайта</option><option value="bad">сайт плохой</option><option value="good">есть хороший</option></select>
   <label>Instagram (имя или ссылка)</label><input data-f="ig" value="${esc(s.ig||"")}" placeholder="@name">
   <label>Заметка</label><input data-f="note" value="${esc(s.note||"")}">
  </div></details>`;
  el.querySelector('[data-f="site"]').value=s.site||"";
  return el}
function match(l){
  const s=L(l.id),st=stage(l),q=$("q").value.trim().toLowerCase(),c=$("city").value;
  if(c&&l.c!==c)return false;
  if(q&&!(l.n.toLowerCase().includes(q)||l.p.includes(q.replace(/\D/g,"")||"~")))return false;
  if($("hideGood").checked&&s.site==="good")return false;
  if(tab==="new")return st==="new";
  if(tab==="due")return st==="due";
  if(tab==="wait")return st==="wait"||st==="wait2";
  if(tab==="done")return st==="done";
  return true}
function counts(){const c={all:LEADS.length,new:0,due:0,wait:0,done:0};
  LEADS.forEach(l=>{const s=stage(l);if(s==="new")c.new++;else if(s==="due")c.due++;else if(s==="done")c.done++;else c.wait++});return c}
function renderTabs(){const c=counts(),T=[["new","Новые"],["due","Пора повторить"],["wait","Ждём ответ"],["done","Ответили"],["all","Все"]];
  $("tabs").innerHTML=T.map(([k,n])=>`<button class="tab" type="button" data-t="${k}" aria-pressed="${tab===k}">${n} ${c[k]}</button>`).join("");
  $("count").textContent=`${c.all} контактов · ${c.new} не тронуто · повторить: ${c.due}`}
function render(){
  renderTabs();const arr=LEADS.filter(match),list=$("list");list.innerHTML="";
  if(!arr.length){list.innerHTML='<div class="empty">Здесь пусто</div>'}
  arr.slice(0,limit).forEach(l=>list.appendChild(card(l)));
  $("moreBtn").hidden=arr.length<=limit;$("moreBtn").textContent=`Показать ещё (${arr.length-limit})`}
function refresh(el,l){const open=el.querySelector("details.more").open,n=card(l);n.querySelector("details.more").open=open;el.replaceWith(n);renderTabs()}
$("list").addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;const el=t.closest(".card"),l=LEADS.find(x=>x.id===el.dataset.id),a=t.dataset.a,s=L(l.id);
  if(a==="copy"){copy(msg(l));return}
  if(a==="tg"||a==="ig"){copy(msg(l));return}
  if(a==="sent"){if(!s.t1)s.t1=Date.now();else s.t2=Date.now();save();render();return}
  if(a==="reply"){s.r=1;save();render();return}
  if(a==="reset"){delete s.t1;delete s.t2;delete s.r;save();render()}
});
$("list").addEventListener("change",e=>{const f=e.target.dataset.f;if(!f)return;const el=e.target.closest(".card"),l=LEADS.find(x=>x.id===el.dataset.id);
  L(l.id)[f]=e.target.value;save();if(f==="site"){render()}else refresh(el,l)});
$("tabs").addEventListener("click",e=>{const t=e.target.closest("[data-t]");if(!t)return;tab=t.dataset.t;limit=40;render()});
$("q").addEventListener("input",()=>{limit=40;render()});$("city").addEventListener("change",()=>{limit=40;render()});
$("hideGood").addEventListener("change",()=>{limit=40;render()});
$("moreBtn").addEventListener("click",()=>{limit+=40;render()});
const cities=[...new Set(LEADS.map(l=>l.c))].sort((a,b)=>a.localeCompare(b,"uk"));
$("city").innerHTML='<option value="">Все города</option>'+cities.map(c=>`<option>${esc(c)} (${LEADS.filter(l=>l.c===c).length})</option>`.replace(`<option>${esc(c)} (`,`<option value="${esc(c)}">${esc(c)} (`)).join("");
["price","me","portfolio","base","t1","t2"].forEach(k=>{const e=$(k);e.value=S.cfg[k];e.addEventListener("input",()=>{S.cfg[k]=e.value;save()});e.addEventListener("change",render)});
$("reset").addEventListener("click",()=>{S.cfg.t1=DEF.t1;S.cfg.t2=DEF.t2;$("t1").value=DEF.t1;$("t2").value=DEF.t2;save();render();toast("Тексты возвращены")});
render();
</script>
